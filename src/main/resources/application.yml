spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id:
            client-secret:
            scope:
              - read:user
              - user:email
logging:
  level:
    root: INFO
    com.example.AutoDocX: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [%X{requestId}] [%X{userId}] %msg%n"
