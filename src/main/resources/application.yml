# Base Configuration (Common settings across all profiles)
spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # OAuth configuration moved to application.properties for direct values

# Default logging configuration
logging:
  level:
    root: INFO
    com.example.AutoDocX: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [%X{requestId}] %msg%n"

# AI Configuration (OpenAI and Gemini)
spring.ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:}
    chat:
      options:
        chatCompletionModel: openai/gpt-oss-20b:free
        max-tokens: 1000

# Pinecone Configuration
pinecone:
  api:
    key: ${PINECONE_API_KEY:}
  environment: us-west1-gcp
  index: codenection

# Gemini Configuration
gemini:
  model:
    name: ${GEMINI_MODEL_NAME:gemini-2.5-flash}
  api:
    key: ${GEMINI_API_KEY:}
    keyList: ${GEMINI_API_KEY_LIST:}
